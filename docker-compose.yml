version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kore-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - kore-mongo-data:/data/db
    networks:
      - kore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kore-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=kore_db
      - NEXTAUTH_SECRET=kore_super_secret_jwt_key_change_in_production_min_32_chars
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:4b
      - SEARCH_PROVIDER=demo
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kore-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - kore-network

volumes:
  kore-mongo-data:

networks:
  kore-network:
    driver: bridge
